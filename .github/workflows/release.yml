name: Build Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and sign release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: meta
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building NeXtep ${VERSION:-unknown} (${GITHUB_REF_NAME})"

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found $APK"

      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nextep.jks"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Sign APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        id: signed
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK/build-tools"; exit 1
          fi
          OUT=app/build/outputs/apk/release/NeXtep-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}.apk
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/nextep.jks" \
            --ks-key-alias "${{ secrets.KEY_ALIAS || 'nextep' }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$OUT" \
            "${{ steps.apk.outputs.path }}"
          "$APKSIGNER" verify --print-certs "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Name unsigned APK
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::KEYSTORE_BASE64 secret is not set; uploading UNSIGNED APK"
          cp "${{ steps.apk.outputs.path }}" \
            "app/build/outputs/apk/release/NeXtep-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-unsigned.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeXtep-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: app/build/outputs/apk/release/NeXtep-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NeXtep ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/NeXtep-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
